<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mic Check</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#3b4cca"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mut:#76757a;--bd:#e2e0da;--red:#d93a3a;--grn:#1f9d55;--acc:#3b4cca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--tx:#f1f1f3;--mut:#9a9aa2;--bd:#34343a;--red:#e5484d;--grn:#30a46c;--acc:#8b98ff}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--tx:#f1f1f3;--mut:#9a9aa2;--bd:#34343a;--red:#e5484d;--grn:#30a46c;--acc:#8b98ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:960px;margin:0 auto;padding:0 12px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.top,.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bar{margin-top:8px}
h1{margin:0;font-size:19px;white-space:nowrap}.sp{flex:1}.sub{color:var(--mut);font-size:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
#showSel{width:auto;flex:1;max-width:220px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
[data-device=mobile] #list{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
[data-device=mobile] h1{font-size:16px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.card.drag{opacity:.5}.card.over{outline:2px solid var(--acc)}
.card.col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px 8px}
.card:not(.col){grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:10px}
.chk{width:56px;height:56px;border-radius:50%;border:0;color:#fff;font-weight:700;background:var(--red);font-size:12px;padding:0}
.chk.on{background:var(--grn)}.col .chk{width:60px;height:60px}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mut);padding:4px 8px;font-size:18px;line-height:1}
.col .grip{position:absolute;top:0;left:0}
.tn{font-weight:600;font-size:13px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tm{font-size:11px;color:var(--mut);margin-top:-3px;cursor:pointer}
.body{display:grid;gap:6px;min-width:0}.r1,.r2{display:flex;gap:6px;align-items:center}
.r1 .mic{width:72px;flex:none}
.chars{display:flex;flex-wrap:wrap;gap:6px}.chars input{width:auto;flex:1 1 90px;min-width:80px}
.plus{width:34px;padding:6px;font-weight:700}
.note{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);min-width:0}
.del{color:var(--red)}.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 3px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(540px,94vw);max-height:88vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.g3{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}.sc{margin-bottom:8px}
.rt{text-align:right;margin-top:12px}.rw{display:flex;gap:6px}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
</style></head><body><div class="wrap">
<header>
<div class="top"><h1>🎤 Mic Check</h1><select id="showSel"></select><button id="shows">⚙ Shows</button><button id="theme" title="Theme"></button></div>
<div class="bar"><span class="sub" id="count"></span><span class="sp"></span><button id="colAll"></button><button id="reset">Reset</button><button class="pri" id="add">+ Add</button></div>
</header>
<div id="list"></div>

<dialog id="dlg"><h3 id="dt" style="margin:0"></h3>
<label>Notes</label><textarea id="dn" rows="4"></textarea>
<label>Mic swaps</label><div id="ds"></div><button id="addswap">+ Add swap</button>
<label>Set changes</label><div id="dc"></div><button id="addset">+ Add set change</button>
<div class="rt"><button class="pri" id="close">Done</button></div></dialog>

<dialog id="sdlg"><h3 style="margin:0">Shows</h3>
<label>Current show name</label><input id="sn">
<label>New show</label><div class="rw"><input id="nn" placeholder="Show name"><button class="pri" id="newshow">Create</button></div>
<label>Share code (send this to others)</label><textarea id="code" rows="3" readonly></textarea><button id="copycode">Copy code</button>
<label>Import a share code or backup</label><textarea id="imp" rows="3" placeholder="Paste here…"></textarea>
<div class="rw" style="margin-top:6px"><button class="pri" id="doimp">Import as new show</button><input type="file" id="fi" accept=".json,.txt"></div>
<label>Backup of all shows</label><textarea id="bk" rows="2" readonly></textarea>
<div class="rw"><button id="copybk">Copy backup</button><button id="dl">Download file</button></div>
<div class="sub" id="msg" style="min-height:18px;margin-top:6px"></div>
<hr><button class="del" id="delshow">Delete this show</button>
<div class="rt"><button class="pri" id="sclose">Done</button></div></dialog>
</div>
<script>
const KEY="micCheckV2",$=id=>document.getElementById(id);
const mq=matchMedia("(max-width:640px),(pointer:coarse)");let mobile=mq.matches;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=()=>({id:uid(),name:"",mic:"",chars:[""],note:"",swaps:[],sets:[],ok:false,col:false});
const fix=p=>{p.id=p.id||uid();p.chars=p.chars&&p.chars.length?p.chars:[""];p.swaps=p.swaps||[];p.sets=p.sets||[];p.name=p.name||"";p.mic=p.mic||"";p.note=p.note||"";if(p.col===undefined)p.col=mobile;return p};
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shows||!S.shows.length){let old=[];try{old=JSON.parse(localStorage.getItem("micCheckV1")||"[]")}catch(e){}
 S={shows:[{id:uid(),name:"My Show",people:old}],cur:null,theme:"auto"}}
S.shows.forEach(s=>{s.id=s.id||uid();s.people=(s.people||[]).map(fix)});
if(!S.shows.some(s=>s.id==S.cur))S.cur=S.shows[0].id;
const TL={auto:"🌓",light:"☀️",dark:"🌙"},TH=Object.keys(TL);if(!TL[S.theme])S.theme="auto";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const sh=()=>S.shows.find(s=>s.id==S.cur),P=()=>sh().people;
function theme(){const r=document.documentElement;S.theme=="auto"?r.removeAttribute("data-theme"):r.dataset.theme=S.theme;$("theme").textContent=TL[S.theme]}
function dev(){document.documentElement.dataset.device=mobile?"mobile":"desktop"}
$("theme").onclick=()=>{S.theme=TH[(TH.indexOf(S.theme)+1)%3];theme();save()};
mq.onchange=e=>{mobile=e.matches;dev();render()};
let delId=null;
function card(p){
 const ex=[p.swaps.length&&p.swaps.length+" swap"+(p.swaps.length>1?"s":""),p.sets.length&&p.sets.length+" set chg"].filter(Boolean).join(" · ");
 if(p.col)return `<div class="card col" data-id="${p.id}"><span class="grip" data-grip>⠿</span><button class="chk ${p.ok?"on":""}" data-a="chk">${p.ok?"✓":"CHECK"}</button><div class="tn" data-a="tog">${esc(p.name)||"Unnamed"}</div>${p.mic?`<div class="tm" data-a="tog">Mic ${esc(p.mic)}</div>`:""}</div>`;
 return `<div class="card" data-id="${p.id}"><button class="chk ${p.ok?"on":""}" data-a="chk">${p.ok?"✓ GOOD":"CHECK"}</button><div class="body">
 <div class="r1"><input data-f="name" value="${esc(p.name)}" placeholder="Real name"><input class="mic" data-f="mic" value="${esc(p.mic)}" placeholder="Mic #"><span class="grip" data-grip>⠿</span><button data-a="tog" title="Collapse">▴</button></div>
 <div class="chars">${p.chars.map((c,j)=>`<input data-c="${j}" value="${esc(c)}" placeholder="Character">`).join("")}<button class="plus" data-a="pc">+</button></div>
 <div class="r2"><button class="note" data-a="note">${p.note?esc(p.note):"Notes, swaps, set changes…"}${ex?" · "+ex:""}</button><button class="del" data-a="del">${delId===p.id?"Tap again":"Remove"}</button></div></div></div>`}
function render(){
 const ps=P();
 $("count").textContent=ps.filter(p=>p.ok).length+"/"+ps.length+" checked · "+(mobile?"📱 Mobile":"🖥 Desktop");
 $("colAll").textContent=ps.length&&ps.every(p=>p.col)?"Expand all":"Collapse all";
 $("list").innerHTML=ps.length?ps.map(card).join(""):'<div class="empty">No one yet. Tap “+ Add”.</div>';
 $("showSel").innerHTML=S.shows.map(s=>`<option value="${s.id}"${s.id==S.cur?" selected":""}>${esc(s.name)||"Untitled"}</option>`).join("");
}
$("list").addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;
 const p=P().find(x=>x.id==b.closest(".card").dataset.id),a=b.dataset.a;
 if(a!="del")delId=null;
 if(a=="chk")p.ok=!p.ok;
 else if(a=="tog")p.col=!p.col;
 else if(a=="pc")p.chars.push("");
 else if(a=="del"){if(delId!==p.id){delId=p.id;render();return}sh().people=P().filter(x=>x!==p);delId=null}
 else if(a=="note"){openDlg(p);return}
 save();render();
 if(a=="pc"){const r=$("list").querySelector(`[data-id="${p.id}"]`).querySelectorAll("[data-c]");r[r.length-1].focus()}
});
$("list").addEventListener("input",e=>{const t=e.target,c=t.closest(".card");if(!c)return;const p=P().find(x=>x.id==c.dataset.id);
 if(t.dataset.f)p[t.dataset.f]=t.value;else if(t.dataset.c!==undefined)p.chars[+t.dataset.c]=t.value;save()});
let dg=null,ov=null;
$("list").addEventListener("pointerdown",e=>{
 const g=e.target.closest("[data-grip]");if(!g)return;e.preventDefault();
 dg=g.closest(".card");dg.classList.add("drag");g.setPointerCapture(e.pointerId);
 g.onpointermove=m=>{
  if(m.clientY<150)scrollBy(0,-12);else if(m.clientY>innerHeight-70)scrollBy(0,12);
  const t=document.elementsFromPoint(m.clientX,m.clientY).find(x=>x.classList&&x.classList.contains("card")&&x!==dg);
  if(ov&&ov!==t)ov.classList.remove("over");ov=t||null;if(ov)ov.classList.add("over")};
 g.onpointerup=g.onpointercancel=()=>{g.onpointermove=g.onpointerup=g.onpointercancel=null;
  const ps=P(),a=ps.findIndex(p=>p.id==dg.dataset.id);
  if(ov){const b=ps.findIndex(p=>p.id==ov.dataset.id),[x]=ps.splice(a,1);ps.splice(b,0,x);save()}
  dg=ov=null;render()}});
$("add").onclick=()=>{const p=mk();P().push(p);save();render();
 const c=$("list").querySelector(`[data-id="${p.id}"]`);c.scrollIntoView({block:"center"});c.querySelector("[data-f=name]").focus()};
$("reset").onclick=()=>{P().forEach(p=>p.ok=false);save();render()};
$("colAll").onclick=()=>{const t=!P().every(p=>p.col);P().forEach(p=>p.col=t);save();render()};
$("showSel").onchange=e=>{S.cur=e.target.value;save();render()};
/* actor dialog */
let cur=null;
function openDlg(p){cur=p;$("dt").textContent=(p.name||"Unnamed")+(p.mic?" · Mic "+p.mic:"");$("dn").value=p.note;drawD();$("dlg").showModal()}
function drawD(){
 const names=P().filter(q=>q!==cur).map(q=>`<option value="${esc(q.name||"Unnamed")}">`).join("");
 $("ds").innerHTML=cur.swaps.map((s,j)=>`<div class="g3"><input data-w="${j}" data-k="when" value="${esc(s.when)}" placeholder="When (scene/cue)"><input data-w="${j}" data-k="who" list="pl" value="${esc(s.who)}" placeholder="Swaps with"><button data-xw="${j}">✕</button></div>`).join("")+`<datalist id="pl">${names}</datalist>`;
 $("dc").innerHTML=cur.sets.map((s,j)=>`<div class="sc"><div class="g2"><input data-z="${j}" data-k="name" value="${esc(s.name)}" placeholder="Set change (e.g. Act 1 – couch off)"><button data-xz="${j}">✕</button></div><textarea rows="2" data-z="${j}" data-k="note" placeholder="Notes for this set change">${esc(s.note)}</textarea></div>`).join("");
}
$("ds").addEventListener("input",e=>{const t=e.target;if(t.dataset.w!==undefined){cur.swaps[+t.dataset.w][t.dataset.k]=t.value;save()}});
$("ds").addEventListener("click",e=>{const b=e.target.closest("[data-xw]");if(b){cur.swaps.splice(+b.dataset.xw,1);save();drawD()}});
$("dc").addEventListener("input",e=>{const t=e.target;if(t.dataset.z!==undefined){cur.sets[+t.dataset.z][t.dataset.k]=t.value;save()}});
$("dc").addEventListener("click",e=>{const b=e.target.closest("[data-xz]");if(b){cur.sets.splice(+b.dataset.xz,1);save();drawD()}});
$("addswap").onclick=()=>{cur.swaps.push({when:"",who:""});save();drawD()};
$("addset").onclick=()=>{cur.sets.push({name:"",note:""});save();drawD()};
$("dn").oninput=e=>{cur.note=e.target.value;save()};
$("close").onclick=()=>$("dlg").close();$("dlg").onclose=render;
/* shows dialog: share codes, import, export */
const b64=u=>{let s="";u.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function enc(show){
 const u=new TextEncoder().encode(JSON.stringify({n:show.name,p:show.people.map(p=>({...p,ok:false}))}));
 if(window.CompressionStream){try{return "MC1-"+b64(new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()))}catch(e){}}
 return "MC0-"+b64(u)}
async function dec(t){
 const u=unb64(t.slice(4).replace(/\s/g,""));
 const x=t.slice(0,4)=="MC1-"?await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text():new TextDecoder().decode(u);
 const o=JSON.parse(x);return{id:uid(),name:o.n,people:o.p.map(p=>fix({...p,id:uid()}))}}
let mt,dsc=false;const say=t=>{$("msg").textContent=t;clearTimeout(mt);mt=setTimeout(()=>$("msg").textContent="",3500)};
function copy(ta){ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
 if(ok)say("Copied!");else if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>say("Copied!")).catch(()=>say("Select the text and copy it"));else say("Select the text and copy it")}
$("shows").onclick=async()=>{dsc=false;$("delshow").textContent="Delete this show";$("sn").value=sh().name;
 $("bk").value=JSON.stringify({mic:1,shows:S.shows});$("code").value="Making code…";$("sdlg").showModal();$("code").value=await enc(sh())};
$("sn").oninput=e=>{sh().name=e.target.value;save();render()};
$("newshow").onclick=()=>{const s={id:uid(),name:$("nn").value.trim()||"New show",people:[]};S.shows.push(s);S.cur=s.id;$("nn").value="";save();render();$("sdlg").close()};
$("copycode").onclick=()=>copy($("code"));$("copybk").onclick=()=>copy($("bk"));
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("imp").value=r.result;say("File loaded — tap Import")};r.readAsText(f)};
$("doimp").onclick=async()=>{const t=$("imp").value.trim();if(!t)return say("Paste a code or backup first");
 try{let add;
  if(t[0]=="{")add=(JSON.parse(t).shows||[]).map(s=>({id:uid(),name:s.name,people:(s.people||[]).map(p=>fix({...p,id:uid()}))}));
  else add=[await dec(t)];
  if(!add.length)throw 0;
  S.shows.push(...add);S.cur=add[0].id;save();render();$("imp").value="";$("sdlg").close();
 }catch(e){say("That code didn't work")}};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("bk").value],{type:"application/json"}));a.download="mic-check-backup.json";a.click()};
$("delshow").onclick=()=>{
 if(S.shows.length<2)return say("You need at least one show");
 if(!dsc){dsc=true;$("delshow").textContent="Tap again to delete";return}
 S.shows=S.shows.filter(s=>s.id!=S.cur);S.cur=S.shows[0].id;dsc=false;save();render();$("sdlg").close()};
$("sclose").onclick=()=>$("sdlg").close();
theme();dev();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
