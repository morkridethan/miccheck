const bodyFor=(s,p,i)=>{const o={};

function push(){
 dirty=false;if(!F)return;
 for(const s of S.shows){if(!s.cloud||!ready[s.id])continue;const m=sent[s.id]=sent[s.id]||{};
  const meta=s.role=="owner"?{name:s.name,admins:s.admins,perms:s.perms,feat:s.feat,off:s.off,reason:s.reason||""}:s.role=="admin"&&canS(s,"perms")?{perms:s.perms}:null;
  if(meta){const g=JSON.stringify(meta);if(m._s!==g){m._s=g;F.setDoc(sdoc(s),meta,{merge:true}).catch(()=>{})}}
  s.people.forEach((p,i)=>{const b=bodyFor(s,p,i),g=JSON.stringify(b);if(m[p.id]!==g){m[p.id]=g;if(Object.keys(b).length)F.setDoc(pdoc(s,p.id),b,{merge:true}).catch(()=>{})}});
  if(s.role=="owner")for(const k in m)if(k[0]!="_"&&!s.people.some(p=>p.id==k)){delete m[k];F.deleteDoc(pdoc(s,k)).catch(()=>{})}}}
function apply(s,ds){
 if(dirty){setTimeout(()=>apply(s,ds),600);return}
 const h=hash(),m=sent[s.id]=sent[s.id]||{};
 const rem=ds.filter(d=>d.exists()).map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)),ids=new Set(rem.map(r=>r.id));
 const next=rem.map(r=>{const p=s.people.find(x=>x.id==r.id)||fix({id:r.id});
  Object.assign(p,{name:r.name||"",mic:r.mic||"",chars:r.chars||[],note:r.note||"",swaps:r.swaps||[],sets:r.sets||[],btns:r.btns||[],bst:r.bst||{},ok:!!r.ok,mine:r.mine||"",code:r.code||""});return p});
 next.forEach((p,i)=>{m[p.id]=JSON.stringify(bodyFor(s,p,i))});
 if(s.role!="actor")s.people.forEach(p=>{if(!ids.has(p.id)&&!(p.id in m))next.push(p)});
 s.people=next;ready[s.id]=true;saveLocal();if(hash()!=h)changed()}
function listen(s){
 if(!F||!s.cloud||unsubs[s.id])return;const e=()=>{};
 const u=[F.onSnapshot(sdoc(s),sn=>{if(!sn.exists())return;const f=()=>{if(dirty){setTimeout(f,600);return}const h=hash(),d=sn.data();
   s.perms=d.perms||{};if(s.role!="owner"){s.name=d.name||s.name;s.admins=d.admins||[];s.feat=d.feat||{};s.off=!!d.off;s.reason=d.reason||""}
   saveLocal();if(hash()!=h)changed()};f()},e)];

 unsubs[s.id]=()=>u.forEach(f=>f())}

 stat:()=>{const s=sh();return `<h3 style="margin:0">Status</h3><div>${s.people.map(p=>`<div class="mrow"><b>${esc(p.name)||"Unnamed"}</b>${p.mic?" · Mic "+esc(p.mic):""}<div style="margin-top:4px"><button class="sbtn ${p.ok?"on":""}" data-p="sok" data-i="${p.id}">${p.ok?"✓ Checked":"Not checked"}</button> ${p.btns.map(b=>`<button class="sbtn ${p.bst[b.id]?"on":""}" data-p="sbt" data-i="${p.id}" data-b="${b.id}">${esc(b.label)}</button>`).join(" ")}</div></div>`).join("")||"No actors yet."}</div>`},
 ppl:()=>{const s=sh(),ro=EDIT()?"":"readonly",o=OWN();return `<h3 style="margin:0">People</h3><table><tr><th>Name</th><th>Mic</th><th>Characters (comma)</th>${s.cloud?"<th>Status buttons (comma)</th>":""}<th>Check</th><th></th></tr>${s.people.map(p=>`<tr data-id="${p.id}"><td><input data-t="name" ${ro} value="${esc(p.name)}"></td><td><input data-t="mic" ${ro} style="width:70px" value="${esc(p.mic)}"></td><td><input data-t="chars" ${ro} value="${esc(p.chars.join(", "))}"></td>${s.cloud?`<td><input data-t="btns" ${ro} value="${esc(p.btns.map(b=>b.label).join(", "))}"></td>`:""}<td><button class="sbtn ${p.ok?"on":""}" data-p="sok" data-i="${p.id}">${p.ok?"✓":"–"}</button></td><td style="white-space:nowrap">${s.cloud?`<button data-p="vas" data-i="${p.id}" title="See what they see">👁</button> `:""}<button data-p="open" data-i="${p.id}">Notes…</button>${o?` <button class="del" data-p="rm" data-i="${p.id}">✕</button>`:""}</td></tr>`).join("")}</table>${EDIT()?'<button class="pri" data-p="addp" style="margin-top:8px">+ Add person</button>':""}`},
 vas:()=>{const s=sh(),p=s.people.find(x=>x.id==vasId);return `<h3 style="margin:0">What ${esc(p?p.name:"they")} sees</h3>${back(vasFrom)}<div class="sub" style="margin:6px 0">Preview only — nothing here can be changed.</div>${aview(p,k=>canR(s,"actor",k),true)}`},
 acc:async()=>{const s=sh();if(!s.cloud||!F)return needOnline;const o=OWN(),info={},ps=s.people.filter(x=>x.name);
  if(o)try{for(const p of ps)if(!p.code)p.code=await mkCode({show:SID(s),role:"actor",me:p.id,who:p.name});save()}catch(e){return `<h3 style="margin:0">Access</h3><div class="sub">Couldn't make codes — check your internet and try again.</div>`}
  await Promise.all([...s.admins,...ps].map(x=>x.code).filter(Boolean).map(async c=>{try{info[c]=(await F.getDoc(F.doc(db,"codes",c))).data()}catch(e){}}));
  const st=c=>{const i=info[c]||{},t=i.seen;return (t?(Date.now()-t<240000?'<b class="g">online now</b>':"last opened "+ago(t)):"never opened")+(i.last?` · last: ${esc(i.last)} (${ago(i.lastAt)})`:"")};
  return `<h3 style="margin:0">Access</h3><div class="mrow"><span class="badge">Admin</span> you (made it)</div>${s.admins.map(a=>`<div class="mrow"><b>Admin – ${esc(a.name)}</b><div class="sub">${st(a.code)}</div>${share(a.code,"Admin – "+a.name)}${o?`<button class="del" data-p="rmadm" data-c="${a.code}">Remove admin</button>`:""}</div>`).join("")}
  ${o?`<div class="mrow"><label style="margin-top:0">Add another admin</label><div class="rw"><input id="an" autocomplete="off"><button class="pri" data-p="mkadm">Make code</button></div></div>`:""}
  ${ps.map(p=>`<div class="mrow"><b>Actor – ${esc(p.name)}</b><div class="sub">${p.code?st(p.code):"no code yet"}</div>${p.code?share(p.code,"Actor – "+p.name):""}<button data-p="vas" data-i="${p.id}" data-b="acc">👁 See what they see</button></div>`).join("")||'<div class="sub">Add actors with names to get their codes.</div>'}`},
 prm:()=>{const s=sh(),sec=(r,t)=>`<h4 style="margin:14px 0 4px">${t}</h4>${PL[r].map(([k,l])=>`<label class="ck"><input type="checkbox" data-pm="${r}.${k}" ${canR(s,r,k)?"checked":""} style="width:auto">${l}</label>`).join("")}`;
  return `<h3 style="margin:0">Permissions</h3>${sec("actor","Actors can…")}${sec("admin","Other admins can…")}`},
 log:async()=>{const s=sh();if(!s.cloud||!F)return needOnline;let h="";
  try{const q=await F.getDocs(F.query(F.collection(db,"shows",SID(s),"log"),F.orderBy("t","desc"),F.limit(40)));h=q.docs.map(d=>{const x=d.data();return `<div class="mrow"><b>${esc(x.who)}</b> ${esc(x.what)} <span class="sub">${ago(x.t)}</span></div>`}).join("")||"Nothing yet."}catch(e){h="Couldn't load — check your internet."}
  return `<h3 style="margin:0">Activity</h3>${h}`},
 setup:()=>{const s=sh(),k=(x,l)=>`<label class="ck"><input type="checkbox" data-sw="f.${x}" ${feat(x)?"checked":""} style="width:auto">${l}</label>`;
  return `<h3 style="margin:0">Setup</h3><label>Online status</label>${!s.cloud?`<button class="pri" data-p="goon">☁ Put this show online</button>`:`<label class="ck"><input type="checkbox" data-sw="live" ${s.off?"":"checked"} style="width:auto">Show is online (others can use it)</label><label>Message shown to others when it's offline</label><textarea data-sw="reason" rows="2">${esc(s.reason)}</textarea>`}
  ${s.cloud?`<label>Sharing options</label>${k("link","Coded links")}${k("sms","Text message button")}${k("mail","Email button")}${k("qr","QR codes")}`:""}
  <label>New shows</label><label class="ck"><input type="checkbox" data-sw="auto" ${S.auto?"checked":""} style="width:auto">New shows go online automatically (off = they start offline)</label>
  <hr><button class="del" data-p="go" data-v="wipe">Wipe show…</button>`},
 wipe:()=>`<h3 style="margin:0">Wipe show</h3>${back("setup")}<p class="sub">This removes every actor from this show so you can start over. The show and its codes stay. Type the show name to confirm.</p><input id="wn" autocomplete="off"><button class="del" id="wgo" data-p="wgo" disabled style="margin-top:8px">Wipe all actors</button>`,
 qr:()=>`<h3 style="margin:0">QR code</h3>${back("acc")}<div class="sub" style="margin:6px 0">${esc(qrN)}</div><div id="qrbox" style="background:#fff;padding:12px;display:inline-block;min-width:80px;min-height:80px"></div><div class="sub" id="qrt"></div>`
};
const loadQR=()=>window.QRCode?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function drawQR(){try{await loadQR();$("qrbox").innerHTML="";new QRCode($("qrbox"),{text:link(qrC),width:220,height:220});$("qrt").textContent=link(qrC)}catch(e){say("QR codes need internet the first time")}}
async function go(v,c,silent){if(c!==undefined)ctl=c;curV=v;if(!$("pop").open)$("pop").showModal();
 if(!silent)$("pb").innerHTML='<div class="sub">Loading…</div>';
 const h=await V[v](),tb=ctl?`<div class="tabs">${tabsFor().map(([k,l])=>`<button data-p="go" data-v="${k}" class="${k==v?"on":""}">${l}</button>`).join("")}</div>`:"";
 $("pop").classList.toggle("wide",ctl);
 $("pb").innerHTML=tb+h+'<div class="sub" id="pm" style="min-height:18px;margin-top:8px"></div><div class="rt"><button class="pri" data-p="x">Close</button></div>';
 if(v=="qr")drawQR()}
$("pop").onclose=()=>{ctl=false;$("pop").classList.remove("wide")};
$("pb").addEventListener("click",async e=>{const b=e.target.closest("[data-p]");if(!b)return;const a=b.dataset.p,s=sh(),d=b.dataset;
 if(a=="go")go(d.v);else if(a=="x")$("pop").close();else if(a=="cpy")copy($(d.t));
 else if(a=="ctlo"){go("ppl",true)}
 else if(a=="cpl")copyText(link(d.c));
 else if(a=="qr"){qrC=d.c;qrN=d.n;go("qr")}
 else if(a=="vas"){vasId=d.i;vasFrom=curV;go("vas")}
 else if(a=="open"){const p=s.people.find(x=>x.id==d.i);if(p)openDlg(p)}
 else if(a=="addp"){const p=mk();s.people.push(p);save();logA("added a person");render();go("ppl",undefined,true)}
 else if(a=="rm"){b.dataset.p="rm2";b.textContent="Sure?"}
 else if(a=="rm2"){s.people=s.people.filter(x=>x.id!=d.i);save();render();go("ppl",undefined,true)}
 else if(a=="sok"||a=="sbt"){const p=s.people.find(x=>x.id==d.i);if(!p||!canS(s,"check"))return say("Not allowed");
  if(a=="sok"){p.ok=!p.ok;logA((p.ok?"checked ":"unchecked ")+(p.name||"a mic"))}else{p.bst[d.b]=!p.bst[d.b];logA("toggled a status for "+(p.name||"an actor"))}
  save();render();go(curV,undefined,true)}
 else if(a=="mkadm"){const n=$("an").value.trim()||"Co-admin";try{const c=await mkCode({show:SID(s),role:"admin",who:n});s.admins.push({name:n,code:c});save();go("acc",undefined,true)}catch(x){say("Couldn't make a code — check your internet")}}
 else if(a=="rmadm"){try{await F.updateDoc(F.doc(db,"codes",d.c),{revoked:true})}catch(x){}s.admins=s.admins.filter(x=>x.code!=d.c);save();go("acc",undefined,true)}
 else if(a=="si"||a=="su"||a=="fp"){const em=$("ae").value.trim(),pw=$("ap").value;if(!em)return say("Enter your email");
  try{if(a=="fp"){await AU.sendPasswordResetEmail(auth,em);return say("Reset email sent — check your inbox")}
   if(!pw)return say("Enter your password");b.disabled=true;
   if(a=="si")await AU.signInWithEmailAndPassword(auth,em,pw);else await AU.createUserWithEmailAndPassword(auth,em,pw);
   $("pop").close()}catch(x){b.disabled=false;say(authErr(x))}}
 else if(a=="so"){await AU.signOut(auth);acctReady=false;go("acct")}
 else if(a=="goon"){if(!F)return say("Online features aren't available right now");if(!user){acctMsg=AU?"Sign in first so this show is saved to your account.":"Sign-in isn't available right now.";go("acct");return}goOnline(s);render();go(ctl?"setup":"set",undefined,true);say("This show is now online")}
 else if(a=="ngo"){const n={id:uid(),name:$("nn").value.trim()||"New show",role:"owner",cloud:false,off:false,admins:[],perms:{},feat:{},people:[]};S.shows.push(n);S.cur=n.id;if(S.auto&&F&&user)goOnline(n);saveLocal();render();$("pop").close()}
 else if(a=="jgo"){const t=$("jc").value.trim();if(!t)return say("Enter your code first");if(!F)return say("You need internet to join");
  b.disabled=true;b.textContent="Joining…";
  try{await joinCode(t);$("pop").close()}catch(x){b.disabled=false;b.textContent="Join";say(x=="nf"||x=="ns"?"That code wasn't found":"Couldn't connect — check your internet")}}
 else if(a=="del"){b.dataset.p="del2";b.textContent="Tap again to confirm"}
 else if(a=="del2"){removeShow(s);$("pop").close()}
 else if(a=="wgo"){s.people=[];save();render();$("pop").close()}
 else if(a=="dl"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([$("te").value],{type:"application/json"}));l.download="mic-check-backup.json";l.click()}
 else if(a=="doimp"){const t=$("ti").value.trim();if(!t)return say("Paste a backup first");
  try{const add=(JSON.parse(t).shows||[]).map(x=>({...x,role:"owner",cloud:false,off:false,sid:undefined,id:uid(),admins:[],perms:{},feat:{},people:(x.people||[]).map(p=>fix({...p,id:uid(),code:""}))}));
   if(!add.length)throw 0;S.shows.push(...add);S.cur=add[0].id;saveLocal();render();$("pop").close()}catch(x){say("That backup didn't work")}}});
$("pb").addEventListener("input",e=>{const t=e.target,s=sh();
 if(t.id=="wn"){$("wgo").disabled=t.value.trim()!=(s.name||"WIPE");return}
 if(t.dataset.sn!==undefined){s.name=t.value;save();render();return}
 if(t.dataset.sw=="reason"){s.reason=t.value;save();return}
 const tr=t.closest("tr[data-id]");if(tr&&t.dataset.t){const p=s.people.find(x=>x.id==tr.dataset.id),v=t.value;if(!p)return;
  if(t.dataset.t=="chars")p.chars=v.split(",").map(x=>x.trim()).filter(Boolean);
  else if(t.dataset.t=="btns")p.btns=v.split(",").map(x=>x.trim()).filter(Boolean).map((l,i)=>({id:(p.btns[i]&&p.btns[i].id)||uid().slice(0,6),label:l}));
  else p[t.dataset.t]=v;save();render()}});
$("pb").addEventListener("change",e=>{const t=e.target,s=sh();
 if(t.id=="fi"){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("ti").value=r.result;say("File loaded — tap Import")};r.readAsText(f)}
 else if(t.dataset.pm){const[r,k]=t.dataset.pm.split(".");(s.perms[r]=s.perms[r]||{})[k]=t.checked;save();logA("changed permissions");render()}
 else if(t.dataset.sw){const k=t.dataset.sw;if(k=="live"){s.off=!t.checked;save();render()}else if(k=="auto"){S.auto=t.checked;saveLocal()}else if(k[0]=="f"){(s.feat=s.feat||{})[k.slice(2)]=t.checked;save()}}});
theme();dev();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
initCloud();
</script></body></html>
