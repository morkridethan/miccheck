<style>

</div>

 if(s.role=="actor"&&next[0])m._m=next[0].mine;
 if(s.role!="actor")s.people.forEach(p=>{if(!ids.has(p.id)&&!(p.id in m))next.push(p)});
 s.people=next;ready[s.id]=true;saveLocal();changed()}
function listen(s){
 if(!F||!s.cloud||unsubs[s.id])return;const e=()=>{};
 const u=[F.onSnapshot(sdoc(s.id),sn=>{if(!sn.exists())return;const d=sn.data();s.name=d.name||s.name;if(s.role!="owner")s.admins=d.admins||[];saveLocal();changed()},e)];
 u.push(s.role=="actor"?F.onSnapshot(pdoc(s.id,s.me),sn=>apply(s,[sn]),e):F.onSnapshot(F.collection(db,"shows",s.id,"people"),qs=>apply(s,qs.docs),e));
 unsubs[s.id]=()=>u.forEach(f=>f())}
function goOnline(s){s.cloud=true;ready[s.id]=true;sent[s.id]={};saveLocal();listen(s);push()}
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const gen=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>AL[b%32]).join("");
async function mkCode(data){for(let i=0;i<5;i++){const c=gen(),r=F.doc(db,"codes",c);if(!(await F.getDoc(r)).exists()){await F.setDoc(r,data);return c}}throw 0}
async function joinCode(t){
 const code=t.toUpperCase().replace(/[^A-Z0-9]/g,""),c=await F.getDoc(F.doc(db,"codes",code));if(!c.exists())throw"nf";
 const d=c.data(),ss=await F.getDoc(sdoc(d.show));if(!ss.exists())throw"ns";
 let s=S.shows.find(x=>x.id==d.show);if(s&&s.role=="owner")throw"own";
 const f={role:d.role,who:d.who||"",ed:!!d.ed,me:d.me||"",cloud:true,code};
 if(s)Object.assign(s,f);else{s={id:d.show,name:ss.data().name||"Show",admins:[],people:[],...f};S.shows.push(s)}
 S.cur=s.id;saveLocal();listen(s);render();ping()}
function ping(){if(!F||document.hidden)return;S.shows.forEach(s=>{if(s.cloud&&s.role!="owner"&&s.code)F.updateDoc(F.doc(db,"codes",s.code),{seen:Date.now()}).catch(()=>{})})}
setInterval(ping,120000);document.addEventListener("visibilitychange",ping);
async function initCloud(){
 try{const A=await import(CDN+"firebase-app.js"),B=await import(CDN+"firebase-firestore.js"),app=A.initializeApp(CFG);
  try{db=B.initializeFirestore(app,{localCache:B.persistentLocalCache({tabManager:B.persistentMultipleTabManager()})})}catch(e){db=B.getFirestore(app)}
  F=B}catch(e){return}
 S.shows.forEach(listen);render();ping()}
/* ---------- shows dialog ---------- */
let mt,dsc=false;const say=t=>{["msg","pm"].forEach(i=>{const e=$(i);if(e)e.textContent=t});clearTimeout(mt);mt=setTimeout(()=>["msg","pm"].forEach(i=>{const e=$(i);if(e)e.textContent=""}),3500)};
function copy(ta){ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
 if(ok)say("Copied!");else if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>say("Copied!")).catch(()=>say("Select the text and copy it"));else say("Select the text and copy it")}
const bk='<button data-p="go" data-v="adv">‹ Back</button>';
const row=(id,label,code)=>`<div class="g2"><div><b>${label}</b><input id="${id}" readonly value="${esc(code)}"></div><button data-p="cpy" data-t="${id}">Copy</button></div>`;
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const needOnline=`<div class="sub" style="margin-top:8px">Put this show online first (Shows → ☁ Put this show online) and make sure you have signal.</div>`;
const V={
 imp:()=>`<h3 style="margin:0">Import</h3><label>Paste a backup</label><textarea id="ti" rows="4"></textarea><div class="rw" style="margin-top:6px"><input type="file" id="fi" accept=".json,.txt"><button class="pri" data-p="doimp">Import</button></div>`,
 exp:()=>`<h3 style="margin:0">Export</h3><label>Backup of your shows</label><textarea id="te" rows="5" readonly>${esc(JSON.stringify({mic:1,shows:S.shows.filter(s=>s.role=="owner")}))}</textarea><div class="rw" style="margin-top:6px"><button data-p="cpy" data-t="te">Copy</button><button data-p="dl">Download file</button></div>`,
 adv:()=>`<h3 style="margin:0">Advanced settings</h3><div class="mn"><button data-p="go" data-v="who">👥 Who's using it</button><button data-p="go" data-v="adm">🛡 Admin code</button><button data-p="go" data-v="act">🎭 Actor codes</button></div>`,
 who:async()=>{const s=sh(),seen={};
  if(F)await Promise.all([...s.admins.map(a=>a.code),...s.people.map(p=>p.code)].filter(Boolean).map(async c=>{try{seen[c]=(await F.getDoc(F.doc(db,"codes",c))).data().seen||0}catch(e){}}));
  const st=c=>!c?"":" · "+c+(!seen[c]?" · not joined yet":Date.now()-seen[c]<240000?' · <b style="color:var(--grn)">online now</b>':" · last seen "+ago(seen[c]));
  return `<h3 style="margin:0">Who's using it</h3>${bk}<div class="mn"><div><span class="badge">Admin</span> you (made it)</div>${s.admins.map(a=>`<div><span class="badge">Admin – ${esc(a.name)}</span> <span class="sub">${a.ed?"can edit":"limited"}${st(a.code)}</span></div>`).join("")}${s.people.filter(p=>p.name).map(p=>`<div><span class="badge">Actor – ${esc(p.name)}</span> <span class="sub">${p.code?st(p.code).slice(3):"no code yet"}</span></div>`).join("")}</div>`},
 adm:()=>`<h3 style="margin:0">Admin code</h3>${bk}<label>Their name</label><input id="an" placeholder="e.g. Sam"><label class="ck"><input type="checkbox" id="ae" style="width:auto">Can add / edit actors (off = only check mics &amp; write notes)</label><button class="pri" data-p="mkadm" style="margin-top:8px">Make code</button><div class="mn" id="ar"></div>`,
 act:async()=>{const s=sh();if(!s.cloud||!F)return `<h3 style="margin:0">Actor codes</h3>${bk}${needOnline}`;
  const ps=s.people.filter(p=>p.name);
  try{for(const p of ps)if(!p.code)p.code=await mkCode({show:s.id,role:"actor",me:p.id,who:p.name});save()}catch(e){return `<h3 style="margin:0">Actor codes</h3>${bk}<div class="sub">Couldn't make codes — check your signal and try again.</div>`}
  return `<h3 style="margin:0">Actor codes</h3>${bk}<div class="sub">Each code opens only that actor's own info.</div><div class="mn">${ps.map((p,i)=>row("ac"+i,"Actor – "+esc(p.name),p.code)).join("")||"Add actors with names first."}</div>${ps.length?`<label>All codes</label><textarea id="all" rows="4" readonly>${esc(ps.map(p=>p.name+": "+p.code).join("\n"))}</textarea><button class="pri" data-p="cpy" data-t="all" style="margin-top:6px">Copy all</button>`:""}`}
};
async function go(v){$("pb").innerHTML=await V[v]()+'<div class="sub" id="pm" style="min-height:18px;margin-top:8px"></div><div class="rt"><button class="pri" data-p="x">Close</button></div>';if(!$("pop").open)$("pop").showModal()}
$("pb").addEventListener("click",async e=>{const b=e.target.closest("[data-p]");if(!b)return;const a=b.dataset.p;
 if(a=="go")go(b.dataset.v);else if(a=="x")$("pop").close();else if(a=="cpy")copy($(b.dataset.t));
 else if(a=="mkadm"){const n=$("an").value.trim()||"Admin 2",ed=$("ae").checked,s=sh();if(!s.cloud||!F)return say("Put the show online first");
  try{const c=await mkCode({show:s.id,role:"admin",who:n,ed});s.admins.push({name:n,ed,code:c});save();$("ar").insertAdjacentHTML("beforeend",row("ax"+s.admins.length,"Admin – "+esc(n),c))}catch(x){say("Couldn't make a code — check your signal")}}
 else if(a=="dl"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([$("te").value],{type:"application/json"}));l.download="mic-check-backup.json";l.click()}
 else if(a=="doimp"){const t=$("ti").value.trim();if(!t)return say("Paste a backup first");
  try{const add=(JSON.parse(t).shows||[]).map(s=>({...s,role:"owner",cloud:false,id:uid(),admins:[],people:(s.people||[]).map(p=>fix({...p,id:uid()}))}));
   if(!add.length)throw 0;S.shows.push(...add);S.cur=add[0].id;saveLocal();render();$("pop").close();$("sdlg").close()}catch(x){say("That backup didn't work")}}});
$("pb").addEventListener("change",e=>{if(e.target.id!="fi")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("ti").value=r.result;say("File loaded — tap Import")};r.readAsText(f)});
$("shows").onclick=()=>{dsc=false;const o=OWN();$("sn").value=sh().name;$("snw").hidden=!o;$("adv").hidden=!o;$("pub").hidden=!(o&&!sh().cloud);$("cin").value="";$("delshow").textContent=o?"Delete this show":"Remove this show";$("sdlg").showModal()};
$("sn").oninput=e=>{sh().name=e.target.value;save();render()};
$("newshow").onclick=()=>{const s={id:uid(),name:$("nn").value.trim()||"New show",role:"owner",cloud:false,admins:[],people:[]};S.shows.push(s);S.cur=s.id;$("nn").value="";if(F)goOnline(s);saveLocal();render();$("sdlg").close()};
$("pub").onclick=()=>{if(!F)return say("Online features aren't available right now");goOnline(sh());$("pub").hidden=true;render();say("This show is now online")};
$("join").onclick=async()=>{const t=$("cin").value.trim();if(!t)return say("Enter your code first");if(!F)return say("You need signal to join");
 try{await joinCode(t);$("sdlg").close()}catch(x){say(x=="own"?"That's already your show":x=="nf"||x=="ns"?"That code wasn't found":"Couldn't connect — check your signal")}};
$("imp").onclick=()=>go("imp");$("exp").onclick=()=>go("exp");$("adv").onclick=()=>go("adv");$("codes").onclick=()=>go("act");
$("delshow").onclick=()=>{
 if(S.shows.length<2)return say("You need at least one show");
 if(!dsc){dsc=true;$("delshow").textContent="Tap again to confirm";return}
 const s=sh();if(unsubs[s.id]){unsubs[s.id]();delete unsubs[s.id]}
 if(F&&s.cloud&&s.role=="owner"){s.people.forEach(p=>F.deleteDoc(pdoc(s.id,p.id)).catch(()=>{}));F.deleteDoc(sdoc(s.id)).catch(()=>{})}
 S.shows=S.shows.filter(x=>x!=s);S.cur=S.shows[0].id;dsc=false;saveLocal();render();$("sdlg").close()};
$("sclose").onclick=()=>$("sdlg").close();
theme();dev();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
initCloud();
</script></body></html>
