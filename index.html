<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mic Check</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#3b4cca"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1f;--mut:#76757a;--bd:#e2e0da;--red:#d93a3a;--grn:#1f9d55;--acc:#3b4cca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--tx:#f1f1f3;--mut:#9a9aa2;--bd:#34343a;--red:#e5484d;--grn:#30a46c;--acc:#8b98ff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.top,.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bar{margin-top:8px}
h1{margin:0;font-size:19px;white-space:nowrap}.sp{flex:1}.sub{color:var(--mut);font-size:12px}
.badge{background:var(--acc);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
#showSel{width:auto;flex:1;max-width:220px}
#list{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}
.card.drag{opacity:.5}.card.over{outline:2px solid var(--acc)}
.card.col{flex:0 0 138px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:14px 6px 8px}
[data-device=mobile] .card.col{flex:0 0 calc((100% - 16px)/3)}
.card:not(.col){flex:1 1 380px;max-width:520px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.card.av{display:block;flex:1 1 100%;max-width:560px}
.chk{width:60px;height:60px;border-radius:50%;border:0;color:#fff;font-weight:700;background:var(--red);font-size:12px;padding:0}
.chk.on{background:var(--grn)}
.lft{display:grid;gap:6px;width:78px;justify-items:center}
.tg{width:100%;padding:10px 4px;font-size:12px;font-weight:600}
.grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--mut);padding:4px 8px;font-size:18px;line-height:1}
.col .grip{position:absolute;top:0;left:0}
.tn{font-weight:600;font-size:13px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm,.tc{font-size:11px;color:var(--mut);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{display:grid;gap:6px;min-width:0}.r1,.r2{display:flex;gap:6px;align-items:center}.r1 .mic{width:72px;flex:none}
.chars{display:flex;flex-wrap:wrap;gap:6px}.cp{display:flex;gap:2px;flex:1 1 120px;min-width:0}
.x{border:0;background:none;color:var(--mut);padding:4px 7px}
.plus{width:34px;padding:6px;font-weight:700}
.note{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);min-width:0}
.del{color:var(--red)}.empty{width:100%;text-align:center;color:var(--mut);padding:40px 0}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:0 4px 4px 0}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:10px 0 3px}
label.ck{text-transform:none;font-size:13px;letter-spacing:0;display:flex;gap:6px;align-items:center}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(540px,94vw);max-height:88vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.g3{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px;align-items:end}.sc{margin-bottom:8px}
.rt{text-align:right;margin-top:12px}.rw{display:flex;gap:6px}.mn{display:grid;gap:8px;margin-top:10px}
.mo{display:none}[data-device=mobile] .mo{display:block}.ro .ed{display:none}
#cin{text-transform:uppercase;letter-spacing:.1em}
hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
</style></head><body><div class="wrap">
<header>
<div class="top"><h1>🎤 Mic Check</h1><select id="showSel"></select><button id="shows">⚙ Shows</button><button id="theme" title="Day / night"></button></div>
<div class="bar"><span class="sub" id="count"></span><span class="sp"></span><button id="codes">🔑 Codes</button><button id="colAll"></button><button id="reset">Reset</button><button class="pri" id="add">+ Add</button></div>
</header>
<div
